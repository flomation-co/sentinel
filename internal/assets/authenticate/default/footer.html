            </form>
        </div>

                <li><a href="https://support.flomation.app/" target="_blank" title="Help &amp; Support" data-lang="help">Help</a></li>
                <li><a href="https://www.flomation.co/legal/terms" target="_blank" title="Terms &amp; Conditions" data-lang="terms">Terms</a></li>

    </div>

    <script>
        const state = document.getElementById("iframe");
        const isIframe = (window.location !== window.parent.location);
        state.value = isIframe

        const container = document.getElementById("authenticate_container");

        if (container && isIframe) {
            document.body.style.background = "transparent"
            container.classList.remove("authenticate_container_small");
            container.classList.add("authenticate_container_full");
            // The head sets this before first paint so the art panel never
            // flashes. Repeated here because that check and this one can
            // disagree: a same-origin frame satisfies both, but the head uses
            // window.top and this uses window.parent, so a nested frame is
            // embedded either way and the layout must follow whichever fired.
            document.documentElement.setAttribute("data-embedded", "true");
        }

        function updateParentSize() {
            if (parent) {
                parent.postMessage({
                    state: "resize",
                    width: container.offsetWidth,
                    height: container.offsetHeight
                }, "*");
            }
        }

        if (isIframe) {
            updateParentSize();

            new ResizeObserver(updateParentSize).observe(container);
        }
    </script>
