<!DOCTYPE html>
<html lang="en-GB">

<head>
    <meta charset="utf-8" />
    <title>Sign in | Flomation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Flomation Ltd" name="author" />
    <meta name="msapplication-TileColor" content="#460070">
    <meta name="theme-color" content="#f6f4f8">
    <meta name="robots" content="noindex, nofollow">

    <meta name="description" content="Sign in to Flomation.">
    <meta property="og:title" content="Sign in | Flomation"/>
    <meta property="og:description" content="Sign in to Flomation."/>
    <meta property="og:url" content="{{ .Domain }}"/>
    <meta property="og:image" content="https://www.flomation.co/social-card.png"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:title" content="Sign in | Flomation"/>
    <meta name="twitter:description" content="Sign in to Flomation."/>
    <meta name="twitter:image" content="https://www.flomation.co/social-card.png"/>

    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/favicon.png">
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/sora-latin.woff2" crossorigin>

    <script>
        // Before the first paint. The split layout must never appear inside an
        // embedded frame, and a class applied after load would show as a flash
        // of the art panel in a host page that never asked for one.
        try {
            if (window.self !== window.top) {
                document.documentElement.setAttribute('data-embedded', 'true');
            }
        } catch (e) {
            // A cross-origin parent can throw on access, and only a frame has
            // one, so the throw is itself the answer.
            document.documentElement.setAttribute('data-embedded', 'true');
        }
    </script>

    <style>
        /* Self-hosted, and the same two files the marketing site serves, so the
           wordmark and headings match it exactly with no third-party request on
           the sign-in path. */
        @font-face {
            font-family: 'Sora';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            src: url("/assets/fonts/sora-latin.woff2") format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: 'Sora';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            src: url("/assets/fonts/sora-latin-ext.woff2") format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        /* Paper craft palette, lifted verbatim from the marketing site's
           tokens.css so the two cannot drift apart by being hand-matched. The
           brand purple is dark enough to be ink (12.9:1 on the page), so the
           primary button is the literal #460070 rather than a tint of it.

           The old dark-scheme names are kept as aliases at the end: the
           fragments and the Go that renders the OAuth buttons refer to these
           classes, and renaming them here would be a change to eleven files for
           no visible gain. */
        :root {
            --bg: #f6f4f8;
            --surface: #fdfcfe;
            --surface-2: #eae3ef;

            /* Warm-neutral rules read cold against lilac paper, so the alpha is
               tinted towards the purple rather than towards black. */
            --border: rgba(70, 45, 84, 0.12);
            --border-2: rgba(70, 45, 84, 0.18);

            --text: #342a38;
            --muted: #473d4b;
            --soft: #524856;
            --dim: #5c5260;

            --violet: #460070;
            --lilac: #6b3f80;
            --teal: #2f6b64;
            --paper-lilac: #ded1e5;

            --grad-cta: linear-gradient(180deg, #5d3670, #460070);
            --glow-cta: 0 6px 18px rgba(70, 0, 112, 0.22);
            --glow-cta-strong: 0 10px 26px rgba(70, 0, 112, 0.34);

            --lift: 0 1px 2px rgba(70, 45, 84, 0.06), 0 8px 24px -12px rgba(70, 45, 84, 0.18);
            --lift-card: 0 1px 2px rgba(70, 45, 84, 0.05), 0 18px 48px -22px rgba(70, 45, 84, 0.34);

            /* Placeholders need to read as a hint rather than a filled value,
               but they are still text somebody has to read: --dim at 75% alpha
               measured 3.97:1, under the 4.5 floor. This is a deliberate step
               lighter than body copy (5.8:1 against 8.7:1) and still passes. */
            --placeholder: #6b6270;

            --danger: #a8212f;
            --danger-wash: rgba(168, 33, 47, 0.07);
            --danger-border: rgba(168, 33, 47, 0.18);

            --font-heading: 'Sora', sans-serif;
            /* Deliberately the same declaration the marketing site carries. The
               Google family is actually named "Grotesk", so this falls through
               to system-ui on both — which is what makes them match. Do not
               correct it here alone; see the website note in CLAUDE.md. */
            --font-body: 'Hanken Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;

            --radius: 16px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
            padding: 0;
            margin: 0;
        }

        body {
            width: 100%;
            min-height: 100%;
            padding: 0;
            margin: 0;
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* The page, not the card, is the centring context. The card used to be
           position:fixed and translated to the middle, which clipped the
           taller screens (set-password carries four requirement lines) on a
           short viewport with no way to scroll to them. */
        .page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
        }

        /* The key art panel. Below the split there is no room for it beside the
           card, and putting it above would mean scrolling past a picture to
           reach the thing you came to do, so it simply goes. */
        .showcase {
            display: none;
        }

        .showcase-art {
            display: block;
            width: 100%;
            height: auto;
            /* The renders come back with their own studio falloff, so a bounded
               image meets the page as a visible box however it is framed.
               Feathering all four edges leaves no boundary to notice. Same
               treatment, same numbers, as the marketing site's aside variant. */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%),
                linear-gradient(to right, transparent 0%, #000 7%, #000 93%, transparent 100%);
            -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to bottom, transparent 0%, #000 9%, #000 91%, transparent 100%),
                linear-gradient(to right, transparent 0%, #000 7%, #000 93%, transparent 100%);
            mask-composite: intersect;
        }

        .showcase-line {
            font-family: var(--font-heading);
            font-size: 21px;
            font-weight: 600;
            line-height: 1.45;
            letter-spacing: -0.015em;
            color: var(--text);
            margin: 4px 0 0;
            max-width: 22ch;
        }

        .showcase-sub {
            font-size: 15px;
            line-height: 1.6;
            color: var(--soft);
            margin: 10px 0 0;
            max-width: 34ch;
        }

        /* The split needs the card's 436px, the gutters and enough left for
           the art to still read as a picture. 940 is where that stops being a
           squeeze, and it takes in iPad landscape and the common laptop
           widths; below it the card stands alone on the paper. */
        @media (min-width: 940px) {
            .page {
                grid-template-columns: minmax(0, 1fr) 436px;
                gap: clamp(48px, 6vw, 96px);
                align-items: center;
                justify-items: stretch;
                max-width: 1160px;
                margin: 0 auto;
                padding: 48px 40px;
            }

            .showcase {
                display: block;
                max-width: 460px;
                justify-self: end;
            }
        }

        .authenticate_container_full {
            width: 100%;
        }

        .authenticate_container_small {
            width: 100%;
            max-width: 436px;
        }

        .authenticate_container {
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            box-shadow: var(--lift-card);
            animation: floatIn 0.22s ease-out;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .identity-container {
            box-sizing: border-box;
        }

        /* The MFA settings pages build their markup in Go and head their
           sections with an h2, so the headings need a home in the stylesheet
           rather than a default browser size twice the body copy. */
        h1,
        h2,
        h3 {
            font-family: var(--font-heading);
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text);
            margin: 0 0 12px;
        }

        h1 { font-size: 21px; line-height: 1.3; }
        h2 { font-size: 18px; line-height: 1.35; }
        h3 { font-size: 16px; line-height: 1.4; }

        strong {
            font-weight: 600;
            color: var(--text);
        }

        .authenticate_header {
            text-align: center;
            padding: 30px 32px 22px;
            border-bottom: 1px solid var(--border);
        }

        .authenticate_header img {
            height: 26px;
            width: auto;
            display: inline-block;
        }

        .authenticate_content {
            padding: 30px 32px 28px;
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
        }

        /* Class only, deliberately.

           An `input[type="submit"]` selector here scores higher than a bare
           `.button-danger`, so the base `border: 0` beat the modifier's border
           and the Disable MFA button rendered as floating red text with no
           outline. Every submit and button input in the templates already
           carries `.button`, so the element selectors were only ever
           redundancy, and the redundancy was the bug. */
        .button {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: 0;
            margin-top: 10px;
            margin-bottom: 5px;
            box-sizing: border-box;
            display: inline-block;
            font-family: var(--font-body);
            appearance: none;
            width: 100%;
            text-align: center;
            transition: box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
            letter-spacing: 0.01em;
        }

        .button-continue {
            background: var(--grad-cta);
            color: #fff;
            box-shadow: var(--glow-cta);
        }

        .button-continue:hover {
            box-shadow: var(--glow-cta-strong);
            transform: translateY(-1px);
        }

        .button-continue:active {
            transform: translateY(0);
            box-shadow: var(--glow-cta);
        }

        .button-back {
            background: transparent;
            color: var(--soft);
            border: 1px solid var(--border-2);
            font-weight: 500;
        }

        /* Turning MFA off, and anything else that takes protection away. Framed
           as a considered choice rather than a primary action: outlined in the
           warning colour instead of filled with it. */
        .button-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger-border);
        }

        .button-danger:hover {
            background: var(--danger-wash);
            border-color: rgba(168, 33, 47, 0.34);
        }

        .button-back:hover {
            background: rgba(222, 209, 229, 0.36);
            color: var(--text);
        }

        input[type="email"],
        input[type="password"],
        input[type="text"]:not(.input_mfa_single) {
            width: 100%;
            padding: 12px 14px;
            background-color: #fff;
            color: var(--text);
            outline: none;
            border: 1px solid var(--border-2);
            border-radius: 10px;
            box-sizing: border-box;
            margin-top: 12px;
            margin-bottom: 12px;
            font-family: var(--font-body);
            font-size: 15px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:not(.input_mfa_single):focus,
        .input_mfa_single:focus {
            border-color: var(--lilac);
            box-shadow: 0 0 0 3px rgba(107, 63, 128, 0.16);
        }

        input[type="email"]::placeholder,
        input[type="password"]::placeholder,
        input[type="text"]::placeholder {
            color: var(--placeholder);
            /* Firefox applies its own placeholder opacity on top of the colour,
               which is what put this under the contrast floor in the first
               place. */
            opacity: 1;
        }

        input[type="hidden"] {
            display: none;
        }

        .input_bg {
            cursor: auto;
        }

        .input_mfa {
            height: auto;
            aspect-ratio: 1;
            border: 1px solid var(--border-2);
            margin: 5px;
            text-align: center;
            font-size: 3em;
            border-radius: 10px;
        }

        .mfa_container {
            display: flex;
            justify-content: center;
            margin-top: 22px;
            margin-bottom: 22px;
        }

        .input_mfa_single {
            width: 100%;
            max-width: 220px;
            height: 54px;
            text-align: center;
            font-size: 1.6em;
            font-family: var(--font-heading);
            font-weight: 600;
            letter-spacing: 0.4em;
            /* The tracking is applied to the right of each glyph, including the
               last, so the run sits left of centre without this. */
            text-indent: 0.4em;
            border: 1px solid var(--border-2);
            border-radius: 10px;
            margin: 0;
            background-color: #fff;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            padding: 10px;
        }

        .center-image {
            text-align: center;
        }

        .center-image img {
            border-radius: 12px;
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        hr {
            margin-top: 15px;
            margin-bottom: 15px;
            border: none;
            border-top: 1px solid var(--border);
        }

        .error {
            color: var(--danger);
            font-weight: 600;
            font-size: 13px;
            margin-top: 8px;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: var(--danger-wash);
            border-radius: 8px;
            border: 1px solid var(--danger-border);
        }

        .password-reset-link {
            color: var(--lilac);
            text-decoration: none;
            cursor: pointer;
            font-size: 13px;
            transition: color 0.15s ease;
        }

        .password-reset-link:hover {
            color: var(--violet);
            text-decoration: underline;
        }

        .subtitle {
            color: var(--soft);
            margin-bottom: 4px;
            font-size: 15px;
            line-height: 1.55;
        }

        .oauth-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 10px;
            color: var(--dim);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .oauth-divider::before,
        .oauth-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 11px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font-body);
            cursor: pointer;
            border: 1px solid var(--border-2);
            background: #fff;
            color: var(--text);
            text-decoration: none;
            box-sizing: border-box;
            transition: box-shadow 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .google-btn:hover {
            border-color: rgba(70, 45, 84, 0.3);
            box-shadow: var(--lift);
            transform: translateY(-1px);
        }

        .google-btn:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .google-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* Passkey prompt. These were inline colour literals on the fragment,
           written for the dark scheme: a 40%-white status line is invisible on
           paper, and the palette cannot reach an inline style to fix it. */
        .passkey-mark {
            text-align: center;
            margin: 10px 0 20px;
            color: var(--teal);
        }

        .passkey-status {
            text-align: center;
            font-size: 13px;
            color: var(--dim);
            margin-bottom: 16px;
        }

        .passkey-error {
            text-align: center;
            font-size: 13px;
            color: var(--danger);
            margin-bottom: 16px;
        }

        .passkey-alt {
            color: var(--dim);
            font-size: 12px;
            text-decoration: underline;
        }

        .passkey-alt:hover {
            color: var(--violet);
        }

        /* Where passkeys are unsupported, the password link is the only way
           forward rather than an aside, so it stops looking like one. */
        .passkey-alt--promoted {
            color: var(--violet);
            font-weight: 600;
        }

        /* A terminal screen that reports an outcome and offers nothing to do. */
        .outcome {
            text-align: center;
        }

        .outcome-mark {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(47, 107, 100, 0.12);
            color: var(--teal);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 24px;
        }

        .outcome-title {
            font-family: var(--font-heading);
            color: var(--teal);
            font-weight: 600;
            font-size: 16px;
            line-height: 1.45;
        }

        .mfa_nudge_body {
            margin-bottom: 16px;
            color: var(--soft);
            line-height: 1.6;
        }

        .invalid,
        .valid {
            font-size: 13px;
            margin: 4px 0;
            padding-left: 24px;
            position: relative;
        }

        .invalid {
            color: var(--dim);
        }

        .valid {
            color: var(--muted);
        }

        .invalid:before {
            content: "\2715";
            width: 16px;
            display: inline-block;
            position: absolute;
            left: 0;
            color: rgba(168, 33, 47, 0.55);
            font-size: 12px;
        }

        .valid:before {
            content: "\2713";
            width: 16px;
            display: inline-block;
            position: absolute;
            left: 0;
            color: var(--teal);
            font-size: 12px;
        }

        .strong {
            font-weight: 600;
            color: var(--violet);
        }

        .footer-links {
            padding: 14px 32px;
            border-top: 1px solid var(--border);
            text-align: center;
            background: rgba(234, 227, 239, 0.4);
        }

        ul {
            width: 100%;
            text-align: center;
            padding: 0;
            margin: 0;
        }

        li {
            display: inline-block;
            min-width: auto;
            margin: 0 12px;
        }

        li > a {
            color: var(--dim);
            display: inline-block;
            text-decoration: none;
            font-size: 12px;
            transition: color 0.15s ease;
        }

        li > a:hover {
            color: var(--violet);
        }

        .pc50 {
            width: 100%;
            display: block;
            margin: 0;
        }

        .continue_creating_title {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 17px;
            letter-spacing: -0.01em;
            margin-bottom: 10px;
        }

        .continue_creating {
            margin-bottom: 16px;
            color: var(--soft);
            line-height: 1.6;
        }

        p {
            color: var(--soft);
            line-height: 1.6;
        }

        /* Password field with show/hide toggle. The wrapper carries the
           top/bottom margin that the input itself used to own — the
           input is reset so the trailing icon button can sit flush
           inside the border-box. */
        .password-field {
            position: relative;
            width: 100%;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .password-field input[type="password"],
        .password-field input[type="text"] {
            margin-top: 0;
            margin-bottom: 0;
            padding-right: 44px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 8px;
            transform: translateY(-50%);
            background: transparent;
            border: 0;
            padding: 6px;
            margin: 0;
            width: auto;
            cursor: pointer;
            color: var(--dim);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .password-toggle:hover,
        .password-toggle:focus-visible {
            color: var(--text);
            background-color: rgba(222, 209, 229, 0.5);
            outline: none;
        }

        .password-toggle svg {
            width: 18px;
            height: 18px;
            display: block;
        }

        /* Default state: showing the closed-eye icon (password masked,
           click to reveal). aria-pressed="true" means the password is
           currently revealed, so we swap to the open-eye crossed-out
           icon (click to mask again). */
        .password-toggle .eye-off { display: none; }
        .password-toggle[aria-pressed="true"] .eye { display: none; }
        .password-toggle[aria-pressed="true"] .eye-off { display: block; }

        /* Embedded in somebody else's page: no art, no paper, no padding. The
           host supplies the ground, and the footer script makes the background
           transparent to let it through. */
        [data-embedded] .page {
            display: block;
            min-height: 0;
            padding: 0;
            max-width: none;
        }

        [data-embedded] .showcase {
            display: none;
        }

        [data-embedded] .authenticate_container {
            box-shadow: none;
            animation: none;
        }

        @media only screen and (max-width: 576px) {
            .page {
                padding: 20px 14px;
            }

            .authenticate_container_small {
                max-width: none;
            }

            .authenticate_content {
                padding: 24px;
            }

            .authenticate_header {
                padding: 24px 24px 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .authenticate_container {
                animation: none;
            }

            .button:hover,
            .google-btn:hover {
                transform: none;
            }
        }
    </style>
    <script>
        // togglePasswordVisibility flips the type of the .password-input
        // inside the calling button's wrapper between "password" and
        // "text". aria-pressed mirrors the revealed state so screen
        // readers (and our CSS icon swap) follow along.
        function togglePasswordVisibility(btn) {
            var input = btn.parentNode.querySelector('input.password-input');
            if (!input) return;
            var revealed = input.type === 'text';
            input.type = revealed ? 'password' : 'text';
            btn.setAttribute('aria-pressed', revealed ? 'false' : 'true');
            btn.setAttribute('aria-label', revealed ? 'Show password' : 'Hide password');
        }
    </script>
