<div class="subtitle">
    Set a password for <span class="strong">$$USER$$</span>
</div>
<div>
    <input type="hidden" name="form_state" id="form_state" maxlength="255" value="set_new_password"/>
    <div class="password-field">
        <input type="password" name="new-password" id="new-password" required maxlength="255" data-lang="enter_password" placeholder="Enter password..." class="input_bg password-input" oninput="updateValidParameters()" autofocus/>
        <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false" onclick="togglePasswordVisibility(this)">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
    </div>
    <div style="margin-bottom: 16px;">
        <p style="font-size: 13px; margin-bottom: 8px;">Your new password must meet these requirements:</p>
        <p id="valid_length" class="invalid" data-lang="valid_length">At least 12 characters long</p>
        <p id="valid_upper" class="invalid" data-lang="valid_upper">Contains at least 1 Uppercase Character</p>
        <p id="valid_lower" class="invalid" data-lang="valid_lower">Contains at least 1 Lowercase Character</p>
        <p id="valid_number" class="invalid" data-lang="valid_number">Contains at least 1 Number</p>
    </div>
    <div>
        <input type="button" value="Set Password" class="button button-continue" onclick="if (form.checkValidity()) { if (isValid()) {this.form.submit();}}"/>
    </div>
</div>
<script>
    function isValidLength(value) {
        return value.length >= 12;
    }

    function isValidUpperCase(value) {
        return /[A-Z]/.test(value);
    }

    function isValidLowerCase(value) {
        return /[a-z]/.test(value);
    }

    function isValidNumber(value) {
        return /[0-9]/.test(value);
    }

    function isValid() {
        const password = document.getElementById("new-password");
        if (password) {
            const value = password.value;
            return isValidLength(value) &&
                isValidUpperCase(value) &&
                isValidLowerCase(value) &&
                isValidNumber(value);
        }

        return false;
    }

    function updateValidParameters() {
        const password = document.getElementById("new-password");

        if (password) {
            const value = password.value;

            if (isValidLength(value)) {
                const field = document.getElementById("valid_length")
                field.classList.add("valid");
                field.classList.remove("invalid");
            } else {
                const field = document.getElementById("valid_length")
                field.classList.remove("valid");
                field.classList.add("invalid");
            }

            if (isValidUpperCase(value)) {
                const field = document.getElementById("valid_upper")
                field.classList.add("valid");
                field.classList.remove("invalid");
            } else {
                const field = document.getElementById("valid_upper")
                field.classList.remove("valid");
                field.classList.add("invalid");
            }

            if (isValidLowerCase(value)) {
                const field = document.getElementById("valid_lower")
                field.classList.add("valid");
                field.classList.remove("invalid");
            } else {
                const field = document.getElementById("valid_lower")
                field.classList.remove("valid");
                field.classList.add("invalid");
            }

            if (isValidNumber(value)) {
                const field = document.getElementById("valid_number")
                field.classList.add("valid");
                field.classList.remove("invalid");
            } else {
                const field = document.getElementById("valid_number")
                field.classList.remove("valid");
                field.classList.add("invalid");
            }
        }
    }
</script>
