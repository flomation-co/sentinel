<div data-lang="enter_2fa_reset" class="subtitle">
    To continue resetting your password for <span class="strong">$$USER$$</span>, enter the code from your authenticator
</div>
<div>
    <input type="hidden" name="form_state" id="form_state" maxlength="255" value="submit_mfa_for_reset"/>

    <div class="mfa_container">
        <input type="text" name="mfa_code" id="mfa_code" required maxlength="6" minlength="6"
               pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code"
               class="input_bg input_mfa_single" autofocus
               oninput="this.value=this.value.replace(/[^0-9]/g,'')" />
    </div>

    <div>
        <input type="submit" value="Continue" data-lang="continue" class="button button-continue"/>
    </div>
</div>
