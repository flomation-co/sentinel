<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkeys | Flomation</title>
    <meta name="theme-color" content="#f6f4f8">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
    <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/sora-latin.woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'Sora';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            src: url("/assets/fonts/sora-latin.woff2") format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        @font-face {
            font-family: 'Sora';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            src: url("/assets/fonts/sora-latin-ext.woff2") format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }

        /* Same palette as the sign-in chrome, which is the same palette as the
           marketing site. This page is standalone rather than assembled from
           the header fragment, so the tokens are repeated here; they are the
           literal values from the site's tokens.css, not an interpretation. */
        :root {
            --bg: #f6f4f8;
            --surface: #fdfcfe;
            --surface-2: #eae3ef;
            --border: rgba(70, 45, 84, 0.12);
            --border-2: rgba(70, 45, 84, 0.18);
            --text: #342a38;
            --soft: #524856;
            --dim: #5c5260;
            --violet: #460070;
            --lilac: #6b3f80;
            --teal: #2f6b64;
            --grad-cta: linear-gradient(180deg, #5d3670, #460070);
            --glow-cta: 0 6px 18px rgba(70, 0, 112, 0.22);
            --glow-cta-strong: 0 10px 26px rgba(70, 0, 112, 0.34);
            --lift-card: 0 1px 2px rgba(70, 45, 84, 0.05), 0 18px 48px -22px rgba(70, 45, 84, 0.34);
            --danger: #a8212f;
            --danger-wash: rgba(168, 33, 47, 0.07);
            --danger-border: rgba(168, 33, 47, 0.18);
            --font-heading: 'Sora', sans-serif;
            /* Matches the marketing site's declaration exactly; see the note in
               the authenticate header about the family name. */
            --font-body: 'Hanken Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            min-height: 100%;
            font-family: var(--font-body);
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        .page-wrapper {
            display: flex;
            justify-content: center;
            padding: 60px 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: var(--lift-card);
        }

        .logo {
            display: block;
            height: 26px;
            width: auto;
            margin: 0 auto 24px;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 21px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 6px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: var(--soft);
            text-align: center;
            margin-bottom: 24px;
            line-height: 1.55;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: box-shadow 0.15s ease, background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
            width: 100%;
            text-align: center;
            letter-spacing: 0.01em;
        }

        .btn-primary {
            background: var(--grad-cta);
            color: #fff;
            box-shadow: var(--glow-cta);
        }

        .btn-primary:hover {
            box-shadow: var(--glow-cta-strong);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: var(--glow-cta);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger-border);
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 500;
            width: auto;
        }

        .btn-danger:hover {
            background: var(--danger-wash);
            border-color: rgba(168, 33, 47, 0.34);
        }

        .btn-back {
            background: transparent;
            color: var(--soft);
            border: 1px solid var(--border-2);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            width: auto;
            padding: 10px 18px;
        }

        .btn-back:hover {
            background: rgba(222, 209, 229, 0.36);
            color: var(--text);
        }

        #status {
            margin: 12px 0;
            font-size: 13px;
            text-align: center;
            line-height: 1.5;
        }

        .status-ok { color: var(--teal); }
        .status-err { color: var(--danger); }

        .cred-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 20px 0;
        }

        .cred-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(234, 227, 239, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .cred-icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            background: rgba(47, 107, 100, 0.12);
            color: var(--teal);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cred-info { flex: 1; min-width: 0; }
        .cred-name { font-size: 14px; font-weight: 600; }
        .cred-meta { font-size: 12px; color: var(--dim); margin-top: 3px; }

        .empty {
            text-align: center;
            padding: 24px 0;
            color: var(--dim);
            font-size: 14px;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 20px;
        }

        .footer-links a {
            color: var(--dim);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.15s ease;
        }

        .footer-links a:hover {
            color: var(--violet);
        }

        @media (max-width: 576px) {
            .card { padding: 24px 18px; }
            .page-wrapper { padding: 30px 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn:hover { transform: none; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="container">
        <div class="card">
            <img src="/assets/images/flomation-wordmark-ink.png" alt="Flomation" class="logo" width="900" height="252">

            <h1>Passkeys</h1>
            <p class="subtitle">Sign in with your fingerprint, face, or security key.<br>Passkeys are phishing-resistant and don't require a password.</p>

            <button class="btn btn-primary" id="add-btn" onclick="registerPasskey()">
                Add Passkey
            </button>

            <div id="status"></div>

            <div class="cred-list" id="cred-list"></div>

            <div class="footer-links">
                <a href="/mfa">MFA Settings</a>
                <a href="/">Back to Login</a>
            </div>
        </div>
    </div>
</div>

<script>
var credentials = $$CREDENTIALS$$;

function renderCredentials() {
    var list = document.getElementById('cred-list');
    if (!credentials || credentials.length === 0) {
        list.innerHTML = '<div class="empty">No passkeys registered yet.</div>';
        return;
    }
    list.innerHTML = credentials.map(function(c) {
        return '<div class="cred-card">' +
            '<div class="cred-icon">' +
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><circle cx="12" cy="16" r="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
            '</div>' +
            '<div class="cred-info">' +
                '<div class="cred-name">' + escapeHtml(c.name) + '</div>' +
                '<div class="cred-meta">Added ' + c.created_at + ' &middot; Last used: ' + c.last_used + '</div>' +
            '</div>' +
            '<button class="btn btn-danger" onclick="deletePasskey(\'' + c.id + '\')">Remove</button>' +
        '</div>';
    }).join('');
}

function escapeHtml(s) {
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
}

function setStatus(msg, isError) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = isError ? 'status-err' : 'status-ok';
}

function registerPasskey() {
    setStatus('Starting registration\u2026', false);

    fetch('/webauthn/register/begin', { method: 'POST', credentials: 'same-origin' })
    .then(function(r) { return r.json(); })
    .then(function(options) {
        options.publicKey.challenge = base64urlToBuffer(options.publicKey.challenge);
        options.publicKey.user.id = base64urlToBuffer(options.publicKey.user.id);
        if (options.publicKey.excludeCredentials) {
            options.publicKey.excludeCredentials.forEach(function(c) { c.id = base64urlToBuffer(c.id); });
        }
        setStatus('Complete the biometric prompt\u2026', false);
        return navigator.credentials.create({ publicKey: options.publicKey });
    })
    .then(function(cred) {
        setStatus('Saving\u2026', false);
        var body = {
            id: cred.id,
            rawId: bufferToBase64url(cred.rawId),
            type: cred.type,
            response: {
                attestationObject: bufferToBase64url(cred.response.attestationObject),
                clientDataJSON: bufferToBase64url(cred.response.clientDataJSON)
            }
        };
        return fetch('/webauthn/register/finish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify(body)
        });
    })
    .then(function(r) { return r.json(); })
    .then(function(result) {
        if (result.error) throw new Error(result.error);
        setStatus('Passkey "' + result.name + '" registered successfully.', false);
        setTimeout(function() { window.location.reload(); }, 1000);
    })
    .catch(function(err) {
        if (err.name === 'AbortError' || err.name === 'NotAllowedError') {
            setStatus('Registration cancelled.', true);
        } else {
            setStatus(err.message || 'Registration failed.', true);
        }
    });
}

function deletePasskey(id) {
    if (!confirm('Remove this passkey? You will no longer be able to sign in with it.')) return;

    fetch('/webauthn/credential/' + id, { method: 'DELETE', credentials: 'same-origin' })
    .then(function(r) { return r.json(); })
    .then(function(result) {
        if (result.error) throw new Error(result.error);
        credentials = credentials.filter(function(c) { return c.id !== id; });
        renderCredentials();
        setStatus('Passkey removed.', false);
    })
    .catch(function(err) {
        setStatus(err.message || 'Unable to remove passkey.', true);
    });
}

function base64urlToBuffer(b64) {
    var base64 = b64.replace(/-/g, '+').replace(/_/g, '/');
    while (base64.length % 4) base64 += '=';
    var bin = atob(base64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
}

function bufferToBase64url(buf) {
    var bytes = new Uint8Array(buf);
    var bin = '';
    for (var i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

renderCredentials();
</script>
</body>
</html>
